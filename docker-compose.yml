services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/changeme
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  web:
    build: .
    ports:
      - "8090:8090"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASS=changeme
    depends_on:
      - neo4j

volumes:
  neo4j_data:
  neo4j_logs:
